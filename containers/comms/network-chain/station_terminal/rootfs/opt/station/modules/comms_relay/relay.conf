[comms_relay]
service          = beacon_relay
role             = station status downlink transmitter
interval_sec     = 5
event_source     = event_svc:9100

[downlink.ground]
target           = ground_link:9101
transport        = plaintext
sign_frames      = false

[downlink.ai]
target           = sentry:9102
transport        = plaintext
sign_frames      = true
key_file         = ./relay.key
key_policy       = factory-default
key_last_rotated = never
