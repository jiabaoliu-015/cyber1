<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROSPACE // SECURE ACCESS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #05070a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(5, 7, 10, 0.98) 0%,
                    rgba(5, 7, 10, 0.85) 42%,
                    rgba(5, 7, 10, 0.35) 100%
                ),
                url("/static/images/aerospace-jet.jpeg") center/cover no-repeat;
            z-index: -1;
        }

        .container {
            width: 900px;
            max-width: 90%;
            display: flex;
            justify-content: flex-start;
        }

        .login-box {
            width: 400px;
            padding: 45px;
            background: rgba(8, 11, 15, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
        }

        .logo {
            font-size: 13px;
            letter-spacing: 4px;
            color: #8d9aa8;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8995a2;
            font-size: 13px;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            color: #9ca7b3;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            background: #11161c;
            border: 1px solid #303943;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #8d9aa8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            background: #d9dee3;
            color: #05070a;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        .status {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #252c33;
            font-size: 10px;
            color: #697581;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .login-box {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="container">

        <div class="login-box">

            <div class="logo">
                AEROSPACE COMMAND
            </div>

            <h1>SECURE GUEST ACCESS</h1>

            <p class="subtitle">
                Restricted mission control system
            </p>

            <form action="{{ action_url }}" method="POST">

                <label for="username">GUEST ID</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter guest ID"
                    required
                >

                <label for="password">ACCESS CODE</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter access code"
                    required
                >

                <button type="submit">
                    AUTHENTICATE
                </button>

            </form>

            <div class="status">
                SYSTEM STATUS: ONLINE<br>
                CLEARANCE SYSTEM: ACTIVE<br><br>
            </div>

        </div>

    </div>

</body>
</html>
