<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROSPACE COMMAND // GUEST NETWORK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #05070a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .background {
            position: fixed; inset: 0;
            background:
                linear-gradient(90deg, rgba(5,7,10,0.98) 0%, rgba(5,7,10,0.85) 42%, rgba(5,7,10,0.35) 100%),
                url("/static/images/aerospace-jet.jpeg") center/cover no-repeat;
            z-index: -1;
        }
        .box {
            width: 420px;
            max-width: 90%;
            padding: 45px;
            background: rgba(8,11,15,0.92);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .logo { font-size: 13px; letter-spacing: 4px; color: #8d9aa8; margin-bottom: 15px; }
        h1 { font-size: 26px; letter-spacing: 3px; margin-bottom: 14px; }
        p { color: #8995a2; font-size: 13px; line-height: 1.9; margin-bottom: 10px; }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #d9dee3;
            font-size: 11px;
            letter-spacing: 2px;
            text-decoration: none;
            border-bottom: 1px solid #40484f;
            padding-bottom: 3px;
        }
        a:hover { color: white; border-color: #8d9aa8; }
    </style>
</head>
<body>
<div class="background"></div>
<div class="box">
    <div class="logo">AEROSPACE COMMAND</div>
    <h1>GUEST NETWORK</h1>
    <p>You are connected to the public guest segment. Limited informational access only.</p>
    <p>Operator-level systems are provisioned separately and are not reachable from this page.</p>
    <a href="/">← RETURN TO PUBLIC PORTAL</a>
</div>
</body>
</html>
