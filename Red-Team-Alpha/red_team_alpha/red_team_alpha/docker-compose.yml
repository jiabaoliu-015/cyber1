services:
  # Main entry point (all paths)
  aerospace-web:
    build: .
    container_name: aerospace-web
    ports:
      - "127.0.0.1:5005:5005"
      - "127.0.0.1:${SSH_PORT:-22}:22"
      - "127.0.0.1:23:23"
      - "127.0.0.1:2022:2022"
      - "127.0.0.1:42121:2121"
      - "127.0.0.1:5006:5006"
      - "127.0.0.1:48080:8080"
      - "127.0.0.1:48081:8081"
      - "127.0.0.1:48090:8090"
      - "127.0.0.1:8095:8095"
      - "127.0.0.1:30000-30009:30000-30009"
      - "127.0.0.1:8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./app/database.db:/app/database.db
    restart: unless-stopped


  # Path 1 
  adcp-web:
    build: ./alpha/adc
    container_name: adcp-web
    network_mode: "service:aerospace-web"
    restart: unless-stopped

  aerospace-ftp:
    build: ./alpha/ftp
    container_name: aerospace-ftp
    network_mode: "service:aerospace-web"
    restart: unless-stopped

  aerospace-ssh:
    build: ./alpha/ssh
    container_name: aerospace-ssh
    network_mode: "service:aerospace-web"
    restart: unless-stopped

  aria-portal:
    build:
      context: ./alpha/ai
    container_name: aria-portal
    environment:
      ARIA_PASSCODE: "ADRJ-6UDP-BRHD"
      ARIA_FLAG: "CITS3006{LFJkvM1LVy}"
      ARIA_NEXT_USER: "sysmaint"
      ARIA_NEXT_PASS: "ytEfgh2aCLTT"
    network_mode: "service:aerospace-web"
    restart: unless-stopped


  # Path 2
  flc-web-portal:
    build: ./bravo/flc
    container_name: flc-web-portal
    network_mode: "service:aerospace-web"
    restart: unless-stopped


  # Path 3
  acc-console:
    build:
      context: .
      dockerfile: charlie/step2-operator-console/Dockerfile
    environment:
      NETWORK_FLAG: "CITS3006{l4A5p3MGYr}"
      HORIZONTAL_FLAG: "CITS3006{2cXVYDsVXj}"
    network_mode: "service:aerospace-web"
    restart: unless-stopped

  acc-router:
    build:
      context: charlie/step3-warhead-router
      args:
        FLAG: "CITS3006{24n4CBiT2K}"
    network_mode: "service:aerospace-web"
    restart: unless-stopped

  acc-armctl:
    build:
      context: charlie/step4-vertical-privesc
      args:
        FLAG: "CITS3006{xyOTpUwAhd}"
    network_mode: "service:aerospace-web"
    restart: unless-stopped

  # Final portal
  # Coordinator note (2 Oct): the three *_CODE defaults below were shifted by
  # one in the submitted file, so the Bravo branch expected the Alpha flag and
  # Alpha expected the ARIA passcode, which is not a scored flag. They now match
  # portal/app.py's own defaults, i.e. each branch's root flag.
  airspace-portal:
    build: ./portal
    container_name: airspace-portal
    environment:
      ALPHA_CODE:   "${ALPHA_CODE:-FLAG{tH3_f1LTa_w4s_0NLY_4_SUgg3sT10N}}"
      BRAVO_CODE:   "${BRAVO_CODE:-FLAG{0EN38FBQE1}}"
      CHARLIE_CODE: "${CHARLIE_CODE:-CITS3006{xyOTpUwAhd}}"
    network_mode: "service:aerospace-web"
    restart: unless-stopped
