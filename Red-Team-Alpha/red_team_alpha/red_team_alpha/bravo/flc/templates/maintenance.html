{% extends "base.html" %}

{% block content %}

<h2>Field Maintenance Terminal</h2> 

<div class="notice">

    <b>Current Privilege</b>

    <p>
        Effective system account:
        <code>www-data</code>
    </p>

</div>

<form method="POST">

    <input
        name="command"
        placeholder="Enter command"
    >

    <button>Execute</button>

</form>

{% if output %}

<pre>{{ output }}</pre>

{% endif %}

{% endblock %}
